# The project name stays "kimai" whatever the folder is called, so the data
# volumes (kimai_data, kimai_mysql) survive a folder rename.
name: kimai

services:
  sqldb:
    image: mysql:8.3
    volumes:
      - mysql:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
    command:
      - --default-storage-engine
      - innodb
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin -uroot -p$$MYSQL_ROOT_PASSWORD ping -h 127.0.0.1 --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kimai:
    # 2.55.0 is the production version; local runs the same one so the plugin is tested as deployed.
    image: kimai/kimai2:apache-2.55.0
    depends_on:
      sqldb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - data:/opt/kimai/var/data
      # Plugins live in the repo (./plugins), so they are versioned and editable
      # from the host; the image's named volume is replaced by this bind mount.
      - ./plugins:/opt/kimai/var/plugins
    ports:
      - '8001:8001'
    environment:
      - APP_SECRET=${APP_SECRET}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS}
      - ADMINMAIL=${ADMIN_EMAIL}
      - ADMINPASS=${ADMIN_PASSWORD}
      - DATABASE_URL=mysql://${DATABASE_USER}:${DATABASE_PASSWORD}@sqldb/${DATABASE_NAME}?charset=utf8mb4&serverVersion=8.3.0

volumes:
  data:
  mysql:
